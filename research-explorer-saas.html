function esc(x){return String(x||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function save(){localStorage.setItem('researcher-session',JSON.stringify(S));$('#saveState').textContent='저장 완료';$('#saveBadge').textContent='저장 완료';$('#saveTime').textContent='마지막 저장 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}function nav(){ $('#steps').innerHTML=STEPS.map(function(x,i){return '<button class="step '+(i===S.step?'on':i<S.step?'done':'')+'" data-go="'+i+'">'+(i+1)+' '+x+'</button>'}).join('');$('#nav').innerHTML=STEPS.map(function(x,i){return '<div class="sideitem '+(i===S.step?'on':'')+'" data-go="'+i+'"><b>'+ (i+1)+'</b>'+x+'</div>'}).join('');document.querySelectorAll('[data-go]').forEach(function(x){x.onclick=function(){S.step=+x.dataset.go;render()}})}function shell(t,d,body){$('#title').textContent=t;$('#desc').textContent=d;$('#count').textContent=(S.step+1)+' / '+STEPS.length;$('#view').innerHTML=body;nav()}function buttons(next){return '<div class="row"><button class="secondary" id="prev">← 이전</button>'+(next?'<button class="primary" id="next">다음 단계 →</button>':'')+'</div>'}function bind(n){$('#prev')&&($('#prev').onclick=function(){S.step=Math.max(0,S.step-1);render()});$('#next')&&($('#next').onclick=function(){S.step=n;save();render()})}

s=Sx>=0?S.picks.filter(function(x){return x!==j}):S.picks.concat(j);render()}});bind(3)}else if(S.step===3){shell('탐구 경로 선택','선택한 경로에 따라 질문·방법·내용이 달라집니다.','<div class="routes">'+ROUTES.map(function(x,j){return '<button class="route '+(S.route===j?'sel':'')+'" data-route="'+j+'">'+x[0]+'<small>'+x[1]+'</small></button>}).join('')+'</div><div class="hint">선택 경로: '+ROUTES[S.route][0]+'</div>'+buttons(true));document.querySelectorAll('[data-route]').forEach(function(b){b.onclick=function(){S.route=+b.dataset.route;render()}});bind(4)}else if(S.step===4)generateView();else if(S.step===5)topicsView();else if(S.step===6)reportView();else finalView()}
function agent(j,s){var e=$('#ag'+j);e.className='agent '+(s==='작동 중'?'active':'done');e.querySelector('.state').innerHTML=s==='작동 중'?'<span class="spin"></span>작동 중':'완료';$('#prog').style.width=((j+(s==='완료'?1:.45))/3*100)+'%'}function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}async function ai(p){var k=$('#key').value.trim();if(!k)return null;var model=$('#model').value.toLowerCase().replaceAll(' ','-'),r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:{temperature:.65,maxOutputTokens:3600}})});if(!r.ok)throw Error('Gemini API 오류 '+r.status);var d=await r.json();return d.candidates?.[0]?.content?.parts?.map(function(x){return x.text||''}).join('')||''}function json(s){if(!s)return null;try{return JSON.parse(s.trim())}catch(e){var a=s.indexOf('['),b=s.lastIndexOf(']');try{return a>=0?JSON.parse(s.slice(a,b+1)):null}catch(x){return null}}}
function demoTopics(){var i=S.info,subject=i.sub||'통합과학',career=i.car||'환경공학',target=i.ta||'학교 주변 하천의 미세플라스틱',views=S.picks.map(function(j){return THINK[j][0]}).join(', ');return Array.from({length:+$('#n').value},function(_,j){return {title:target+'의 발생 원인과 수질 환경에 미치는 영향 '+(j?'비교':'분석'),reason:i.mo||'학생의 활동 키워드와 관찰 내용에서 지속적인 관심이 확인되어 선정함.',core:'관심 대상의 주요 특징과 원인은 무엇이며 수질 환경에 어떤 영향을 미치는가?',sub:'자료·사례 간 차이는 무엇인가? 추가 관찰로 확인할 수 있는 변수는 무엇인가?',basic:'관련 개념과 선행 자료를 조사하고 종류·발생 경로·영향 사례를 기준에 따라 정리한다.',deep:'자료 비교와 안전한 관찰 또는 공개 데이터 분석을 설계하여 조건별 차이를 분석하고 개선 방안을 제안한다.',method:ROUTES[S.route][0]+'에 맞춰 문헌 조사, 사례 비교, 관찰 기록을 진행한다. '+views+' 관점을 분석 기준으로 사용한다.',materials:'공공 환경 데이터, 기관 자료, 관찰 기록지, 분석 기준표',expected:'발생 경로와 영향 사이의 관계를 근거로 설명하고 자료의 한계와 후속 질문을 제시한다.',difficulty:'측정 단위와 자료 출처가 다를 수 있으므로 비교 기준을 통일한다.',link:subject+' 및 '+career+' 진로와 연계',follow:'지역별 자료 비교와 저감 방안 효과 검토로 확장',review:'범위를 학교 주변과 공개 자료로 제한하면 실행 가능성이 높음.'}})}
function generateView(){shell('AI 에이전트 실행','수집 → 주제 설계 → 검토 순서로 진행합니다.','<div class="notice">API 키가 없으면 예시 결과로 전체 흐름을 테스트합니다.</div><div class="agents"><div class="agent" id="ag0"><div class="icon i1">01</div><div><h4>수집 에이전트</h4><p>활동 맥락·관심사·탐구 가능 요소 추출</p></div><div class="state">준비</div></div><div class="agent" id="ag1"><div class="icon i2">02</div><div><h4>주제 설계 에이전트</h4><p>주제 후보·기본·심화·방법 구성</p></div><div class="state">준비</div></div><div class="agent" id="ag2"><div class="icon i3">03</div><div><h4>검토 에이전트</h4><p>범위·실행 가능성·안전성 점검</p></div><div class="state">준비</div></div><div class="bar"><i id="prog"></i></div></div><button class="primary" id="run">에이전트 실행하기</button><p class="hint" id="log">상태 메시지가 여기에 표시됩니다.</p>'+buttons(false));$('#run').onclick=runAI;bind(3)}
async function runAI(){var log=function(x){$('#log').textContent=x};$('#run').disabled=true;try{agent(0,'작동 중');log('수집 에이전트 준비 중 · 핵심 관심사 정리 중');var i=S.info,col=await ai('수집 에이전트다. 학생의 활동 키워드·관찰·동기에서 핵심 관심사, 탐구 대상, 문제 상황, 활동의 맥락·과정·역할·결과, 모호한 정보를 한국어로 정리하라. 학생 입력 밖의 사실을 만들지 말라. '+JSON.stringify({info:i,views:S.picks.map(function(j){return THINK[j][0]}),route:ROUTES[S.route][0]}));await wait(400);agent(0,'완료');agent(1,'작동 중');log('주제 후보 생성 중 · 기본·심화 탐구 내용 작성 중');var out=await ai('주제 설계 에이전트다. 수집 결과를 바탕으로 실행 가능한 탐구 주제 '+$('#n').value+'개를 JSON 배열로 작성하라. 각 객체 키: title,reason,core,sub,basic,deep,method,materials,expected,difficulty,link,follow,review. 선택 관점·탐구 경로를 반영하고 위험한 실험은 안전한 관찰/공개자료로 대체하라. 수집:'+ (col||JSON.stringify(i)));S.topics=json(out)||demoTopics();await wait(400);agent(1,'완료');agent(2,'작동 중');log('실행 가능성 점검 중 · 최종 표현 다듬는 중');var chk=await ai('검토 에이전트다. 아래 주제 후보의 범위, 학생 수준, 자료 접근성, 질문과 내용의 일치, 안전성을 점검하고 수정된 JSON 배열만 반환하라. '+JSON.stringify(S.topics));S.topics=json(chk)||S.topics;await wait(400);agent(2,'완료');S.step=5;save();render()}catch(e){alert(e.message+'\\n데모 결과로 전환합니다.');S.topics=demoTopics();S.step=5;save();render()}finally{if($('#run'))$('#run').disabled=false}}
function bl(n,v){return '<div class="block"><b>'+n+'</b><p>'+esc(v)+'</p></div>}function topicsView(){shell('탐구 주제 후보','카드를 비교한 뒤 하나를 선택해 보고서 편집으로 이동하세요.','<div class="hint">선택 관점 · '+S.picks.map(function(j){return THINK[j][0]}).join(' + ')+' · 탐구 경로 · '+ROUTES[S.route][0]+'</div>'+S.topics.map(function(t,j){return '<article class="topic"><h3><span class="num">주제 '+(j+1)+'</span>'+esc(t.title)+'</h3><div class="tg">'+bl('주제 선정 이유',t.reason)+bl('핵심 탐구 질문',t.core)+bl('보조 탐구 질문',t.sub)+bl('기본 탐구 내용',t.basic)+bl('심화 탐구 내용',t.deep)+bl('탐구 방법',t.method)+bl('필요한 자료',t.materials)+bl('예상 결과',t.expected)+bl('예상되는 어려움',t.difficulty)+bl('과목·진로 연계성',t.link)+bl('검토 결과',t.review)+'</div><button class="primary choose" data-topic="'+j+'">이 주제로 진행하기 →</button></article>}).join('')+buttons(false));document.querySelectorAll('[data-topic]').forEach(function(b){b.onclick=function(){S.selected=+b.dataset.topic;S.chapters=CHAPS.map(function(c){return {title:c[0],body:c[1]+'\\n\\n주제: '+S.topics[S.selected].title}});S.step=6;save();render()}});bind(4)}
function reportView(){var t=S.topics[S.selected]||demoTopics()[0];shell('탐구 보고서 편집','목차 제목과 본문을 직접 수정하고 항목을 추가·삭제하세요.','<div class="final"><h3>'+esc(t.title)+'</h3><p><b>기본 탐구</b> '+esc(t.basic)+'</p><p><b>심화 탐구</b> '+esc(t.deep)+'</p></div><div class="row"><button class="secondary" id="add">+ 항목 추가</button><button class="secondary" id="down">전체 보고서 다운로드</button></div><div id="chapters">'+S.chapters.map(function(c,j){return '<div class="edit"><input value="'+esc(c.title)+'" data-ct="'+j+'"><textarea data-cb="'+j+'">'+esc(c.body)+'</textarea><button class="mini danger" data-del="'+j+'">삭제</button></div>}).join('')+'</div>'+buttons(true));document.querySelectorAll('[data-ct]').forEach(function(x){x.oninput=function(){S.chapters[+x.dataset.ct].title=x.value;save()}});document.querySelectorAll('[data-cb]').forEach(function(x){x.oninput=function(){S.chapters[+x.dataset.cb].body=x.value;save()}});document.querySelectorAll('[data-del]').forEach(function(x){x.onclick=function(){S.chapters.splice(+x.dataset.del,1);save();render()}});$('#add').onclick=function(){S.chapters.push({title:'새 목차',body:'내용을 입력하세요.'});save();render()};$('#down').onclick=function(){download(S.chapters.map(function(c,j){return (j+1)+'. '+c.title+'\\n'+c.body}).join('\\n\\n'),'탐구보고서-초안.txt')};bind(7)}
function finalView(){var t=S.topics[S.selected]||demoTopics()[0],text='탐구 주제: '+t.title+'\\n\\n핵심 질문: '+t.core+'\\n\\n기본 탐구: '+t.basic+'\\n\\n심화 탐구: '+t.deep+'\\n\\n탐구 방법: '+t.method+'\\n\\n보고서 목차:\\n'+S.chapters.map(function(c,j){return (j+1)+'. '+c.title}).join('\\n');shell('최종 탐구 계획 확인','선택한 주제와 보고서 구조를 확인하세요.','<div class="final"><h3>'+esc(t.title)+'</h3><p><b>과목·진로</b> '+esc(t.link)+'</p><p><b>핵심 질문</b> '+esc(t.core)+'</p><p><b>탐구 방법</b> '+esc(t.method)+'</p><p><b>후속 탐구</b> '+esc(t.follow)+'</p></div><div class="row"><button class="primary" id="df">탐구 계획 다운로드</button><button class="secondary" id="cf">계획 복사</button></div>'+buttons(false));$('#df').onclick=function(){download(text,'탐구계획-최종.txt')};$('#cf').onclick=function(){navigator.clipboard.writeText(text).then(function(){alert('복사했습니다.')})};bind(6)}
function download(x,n){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/plain;charset=utf-8'}));a.download=n;a.click()}function demoData(){S.info={sid:'20260101',nm:'김학생',gr:'2학년',cl:'3반',sub:'통합과학',car:'환경공학',kw:'미세플라스틱, 수질 오염, 문헌 조사, 실험 설계, 결과 비교',ob:'수질 오염 문제에 관심을 갖고 미세플라스틱 자료를 조사했으며, 간단한 실험을 설계하고 결과를 비교함',mo:'생활 주변 수질 오염을 과학적 근거로 이해하고 개선 방법을 찾아보고 싶음',ta:'학교 주변 하천의 미세플라스틱'};S.picks=[4,6,9];S.route=3;S.step=0;save();render()}
